{% extends "base.html" %}
{% block title %}Novo Livro &mdash; Leitor{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Upload de novo livro</h1>

<form hx-post="/api/livro/upload/file"
      hx-encoding="multipart/form-data"
      hx-target="#resultado"
      hx-swap="innerHTML"
      class="card p-4">

    <div class="mb-3">
        <label for="titulo" class="form-label">Titulo do livro</label>
        <input type="text" class="form-control" id="titulo" name="titulo" required minlength="1" maxlength="500">
    </div>

    <div class="mb-3">
        <label for="autor" class="form-label">Autor</label>
        <input type="text" class="form-control" id="autor" name="autor" required minlength="1" maxlength="500">
    </div>

    <div class="mb-3">
        <label for="arquivo" class="form-label">Arquivo PDF</label>
        <input type="file" class="form-control" id="arquivo" name="arquivo" accept="application/pdf" required>
    </div>

    <button type="submit" class="btn btn-primary">Enviar</button>
</form>

<div id="resultado" class="mt-3"></div>
{% endblock %}
